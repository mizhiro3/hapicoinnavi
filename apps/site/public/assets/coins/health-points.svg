<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">健康ポイント</title>
  <desc id="desc">元画像の構図と配色を保って低解像度化したドット絵アイコン</desc>
  <defs>
    <clipPath id="frame"><rect width="320" height="320" rx="32"/></clipPath>
    <filter id="posterize" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 .2 .4 .6 .8 1"/>
        <feFuncG type="discrete" tableValues="0 .2 .4 .6 .8 1"/>
        <feFuncB type="discrete" tableValues="0 .2 .4 .6 .8 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="320" height="320" fill="#f5f0df"/>
    <image width="320" height="320" filter="url(#posterize)" image-rendering="pixelated" style="image-rendering:pixelated;image-rendering:crisp-edges" preserveAspectRatio="none" href="data:image/png;base64,"/>
    <path d="M0 216h48v-8h32v8h64v-8h32v8h64v-8h32v8h48v104H0z" fill="#f5f0df"/>
  </g>
  <text x="160" y="282" fill="#1e3038" font-family="Hiragino Kaku Gothic ProN, Yu Gothic, Noto Sans JP, sans-serif" font-size="30" font-weight="700" letter-spacing=".4" text-anchor="middle">健康ポイント</text>
</svg>
